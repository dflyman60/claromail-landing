<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout canceled — ClaroMail</title>
    <meta
      name="description"
      content="Checkout was canceled. You can return to the Claro Chrome extension anytime."
    />
    <link rel="canonical" href="https://claromail.app/checkout/cancel" />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/images/claro-icon.png" type="image/png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-nav">
      <div class="wrap nav-inner">
        <a class="brand brand--nav" href="/">
          <img
            class="brand-mark"
            src="/images/claro-icon.png"
            alt=""
            width="48"
            height="48"
          />
          <span class="brand-copy">
            <span class="brand-name"
              >Claro<span class="brand-mail">Mail</span></span
            >
            <span class="brand-tag">Inbox Clarity</span>
          </span>
        </a>
      </div>
    </header>

    <main class="wrap" style="padding: 64px 20px 80px; max-width: 640px">
      <h1 style="font-family: Fraunces, Georgia, serif; margin: 0 0 12px">
        Checkout canceled
      </h1>
      <p style="font-size: 1.05rem; line-height: 1.5; color: #5a6a7a">
        No charge was made. You can close this tab and return to the
        <strong>Claro</strong> side panel whenever you’re ready to try again.
      </p>
      <p style="margin-top: 28px">
        <a class="btn btn-primary" href="/">Back to ClaroMail</a>
        <a class="btn" href="/pricing" style="margin-left: 10px">View pricing</a>
      </p>
    </main>
  </body>
</html>
